# SPDX-License-Identifier: MIT
# LG G8 candidate, RAM-only. The generic image/write/installer paths refuse
# this boot method. The existing stock recovery is on B; do not assume A.
# See BRINGUP-M1.md before attempting any device operation.
CODENAME=alphalm
NAME="LG G8"
SOC=sm8150
COMPATIBLE="lge,alphalm"
BOOT_METHOD=ram-only
BOOT_IMAGES=""
UFS_RW=""
INITRAMFS_INIT=/initramfs/init
PANEL_SIZE=1440x3120
